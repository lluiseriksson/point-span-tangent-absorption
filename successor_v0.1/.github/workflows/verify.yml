name: verify-paper

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact finite replays
        working-directory: repro
        run: python run_all_replays.py
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          latexmk_use_xelatex: false
